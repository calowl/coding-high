<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coding High — Log In</title>

  <link rel="stylesheet" href="css/style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
</head>
<body>

  <!-- Auth screen — the only thing on this page.
       JS toggles between login and register forms. -->
  <section id="screen-auth" class="screen active">
    <div class="auth-container">

      <h1 class="game-title">Coding&nbsp;High</h1>
      <p class="tagline">Have a nice quiz themed chat with the languages, and try not to crash out.</p>

      <!-- LOGIN FORM -->
      <div id="login-form" class="auth-form">
        <h2>Log In</h2>

        <label for="login-username">Username</label>
        <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username" />

        <label for="login-password">Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password" />

        <p id="login-error" class="error-msg" aria-live="polite"></p>

        <button id="login-btn" class="btn-primary">Log In</button>

        <p class="switch-form">
          No account?
          <button id="show-register" class="link-btn">Register here</button>
        </p>
      </div>

      <!-- REGISTER FORM -->
      <div id="register-form" class="auth-form hidden">
        <h2>Register</h2>

        <label for="register-username">Username</label>
        <input type="text" id="register-username" placeholder="Choose a username" autocomplete="username" />

        <label for="register-password">Password</label>
        <input type="password" id="register-password" placeholder="Choose a password (min 4 chars)" autocomplete="new-password" />

        <label for="register-confirm">Confirm Password</label>
        <input type="password" id="register-confirm" placeholder="Repeat your password" autocomplete="new-password" />

        <p id="register-error" class="error-msg" aria-live="polite"></p>

        <button id="register-btn" class="btn-primary">Create Account</button>

        <p class="switch-form">
          Already have an account?
          <button id="show-login" class="link-btn">Log in here</button>
        </p>
      </div>

    </div>
  </section>

  <!-- login.js needs Storage and Auth from these two files -->
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
